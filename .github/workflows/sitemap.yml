name: Update sitemap

on:
  push:
    branches: [main]
    paths: ['*.html', 'blog/*.html', 'es/**/*.html']
  # Run by hand (gh workflow run sitemap.yml) when the rules here change but no
  # page did, so the sitemap catches up without a dummy page edit.
  workflow_dispatch:

jobs:
  sitemap:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate sitemap.xml
        run: |
          DOMAIN="https://madebysebby.com"

          echo '<?xml version="1.0" encoding="UTF-8"?>' > sitemap.xml
          echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">' >> sitemap.xml

          # The root of each tree, emitted as a directory URL rather than
          # /index.html so it matches the canonical the page itself declares.
          for PAIR in "index.html:/" "es/index.html:/es/"; do
            F="${PAIR%%:*}"; U="${PAIR##*:}"
            FDATE=$(git log -1 --format=%aI -- "$F" | cut -d'T' -f1)
            echo "  <url><loc>${DOMAIN}${U}</loc><lastmod>${FDATE}</lastmod></url>" >> sitemap.xml
          done

          # Everything else, across both trees.
          #
          # src/ holds the bilingual sources that build.py splits into these
          # trees. They are not pages. If they reached the sitemap they would be
          # indexable duplicates serving both languages at one URL -- precisely
          # the defect the split exists to remove.
          #
          # Pages marked noindex (forwarding stubs for retired URLs, the
          # form confirmations) are skipped by reading the page itself, so a
          # new stub can never slip into the sitemap by being missed here.
          find . -name '*.html' \
            -not -path './src/*' \
            -not -name 'index.html' \
            -not -name '404.html' \
            | sed 's|^\./||' | sort \
            | while read f; do
                grep -q 'name="robots" content="noindex' "$f" && continue
                FDATE=$(git log -1 --format=%aI -- "$f" | cut -d'T' -f1)
                echo "  <url><loc>${DOMAIN}/${f}</loc><lastmod>${FDATE}</lastmod></url>" >> sitemap.xml
              done

          echo '</urlset>' >> sitemap.xml

          echo "sitemap.xml: $(grep -c '<loc>' sitemap.xml) URLs"

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git diff --cached --quiet && echo "No sitemap changes" && exit 0
          git commit -m "chore: auto-update sitemap.xml"
          git push

# NOTE: There used to be a "Ping Google" step hitting
# https://www.google.com/ping?sitemap=... — do not re-add it. Google retired
# that endpoint in 2023; it now returns HTTP 404 with "Sitemaps ping is
# deprecated" (see https://developers.google.com/search/blog/2023/06/sitemaps-lastmod-ping).
# Because it ran as `curl -s` without `-f`, it exited 0 and the workflow kept
# reporting success while doing nothing.
# Google now discovers updates via the <lastmod> dates this workflow writes,
# plus the sitemap registered in Search Console. Nothing to call.
